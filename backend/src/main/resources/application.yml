server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: library-recommendation
  config:
    import: optional:file:./.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library_recommendation}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-print: false

recommendation:
  weights:
    hot: ${RECOMMEND_WEIGHT_HOT:0.35}
    content: ${RECOMMEND_WEIGHT_CONTENT:0.40}
    item-cf: ${RECOMMEND_WEIGHT_ITEM_CF:0.25}

ai:
  enabled: ${AI_ENABLED:true}
  base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
  api-key: ${AI_API_KEY:}
  chat-model: ${AI_CHAT_MODEL:deepseek-chat}
  embedding-base-url: ${EMBEDDING_BASE_URL:}
  embedding-api-key: ${EMBEDDING_API_KEY:}
  embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  temperature: ${AI_TEMPERATURE:0.3}
  max-context-books: ${AI_MAX_CONTEXT_BOOKS:6}

logging:
  level:
    root: INFO
    com.library.recommendation: INFO
    com.library.recommendation.mapper: WARN
